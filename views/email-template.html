<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Wayu Farms Email Template</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #2d5a27; color: white; padding: 20px; text-align: center; }
        .content { padding: 30px; background-color: #f9f9f9; }
        .footer { background-color: #1e3a1a; color: white; padding: 15px; text-align: center; font-size: 12px; }
        .button { background-color: #e6b325; color: #333; padding: 10px 20px; text-decoration: none; border-radius: 5px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Wayu Farms</h1>
            <p>Gujizone, Borena</p>
        </div>
        
        <div class="content">
            <!-- Content will be inserted here -->
            {{content}}
        </div>
        
        <div class="footer">
            <p>Wayu Farms &copy; 2024 | Gujizone, Borena Region</p>
            <p>Phone: +251 912 345 678 | Email: info@wayufarms.com</p>
        </div>
    </div>
</body>
</html>
